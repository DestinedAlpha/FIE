name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      - run: uv run mypy src
      - run: uv run pytest -q
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $parseTokens = $null
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build && npm test
        working-directory: apps/web
      - name: Smoke test Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType File -Path .env -Force | Out-Null
          uv run python -c "from fpl_intelligence.storage import Store; s=Store(); [s.put(kind,{}) for kind in ('market','state','selected_plan')]; s.put('forecast',{'model_version':'learned-points-v1'}); import gzip; from pathlib import Path; p=Path('data/state.sqlite'); Path('data/state.sqlite.gz').write_bytes(gzip.compress(p.read_bytes())); p.unlink()"
          $launcher = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/start.ps1','-NoBrowser' -PassThru -RedirectStandardOutput launcher.out -RedirectStandardError launcher.err
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:8000/api/health' -TimeoutSec 1
                if ($health.status -eq 'ok') { $healthy = $true; break }
              } catch { }
              if ($launcher.HasExited) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $healthy) {
              Get-Content launcher.out,launcher.err
              throw 'Windows launcher did not reach a healthy loopback server'
            }
            $page = Invoke-WebRequest 'http://127.0.0.1:8000/'
            if ($page.Content -notmatch '<div id="root">') { throw 'Built interface was not served' }
          } finally {
            if (-not $launcher.HasExited) { taskkill /PID $launcher.Id /T /F | Out-Null }
          }

  neural:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --extra neural
      - run: uv run --extra neural pytest tests/test_fusion.py -q
